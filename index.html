     The stored choice lives in localStorage key "mo-theme". -->
<script>
(function () {
  var t = 'light';
  try { var q = new URLSearchParams(location.search).get('theme'); t = q || localStorage.getItem('mo-theme') || 'light'; } catch (e) { /* storage unavailable: stay light */ }
  document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
})();
</script>

/* ===== Project patterns built only from tokens (named for engineers) ===== */
@layer components {
  /* design-system 7.8 dialog recipe */
  .dialog { @apply fixed inset-x-0 bottom-0 max-h-[90dvh] overflow-y-auto rounded-t-lg bg-surface p-4 pb-[max(1rem,env(safe-area-inset-bottom))]

              md:rounded-lg md:p-6; }
  .dialog-title { @apply text-heading font-semibold text-ink; }
  .dialog-body { @apply mt-2 text-body text-ink-soft; }

  .step-list { @apply flex flex-col gap-2; }
  .step-row { @apply flex min-h-touch items-center gap-3 rounded-md border border-line bg-surface px-3 py-2 text-body; }
  .choice { @apply rounded-md border border-line-strong bg-surface px-3 py-1 has-[:checked]:border-primary has-[:checked]:bg-primary-tint-strong; }
  .choice label { @apply flex min-h-touch cursor-pointer items-center gap-3 font-semibold text-ink; }
  .choice input { @apply size-5 shrink-0 accent-primary; }
  .check-row { @apply flex min-h-touch cursor-pointer items-start gap-3 py-2 text-body text-ink; }
  .check-row input { @apply mt-0.5 size-5 shrink-0 accent-primary; }
  /* Tabs (Admin users: Awaiting approval, Active, Suspended). Selected tab: primary text plus a 3 px bar, never colour alone. */
  .tabs { @apply flex gap-1 overflow-x-auto border-b border-line; }
  .tab { @apply inline-flex min-h-touch shrink-0 cursor-pointer items-center gap-2 bg-transparent px-3 text-small font-semibold text-ink-soft hover:text-ink md:px-4 md:text-body; }
  .tab[aria-selected="true"] { @apply text-primary; box-shadow: inset 0 -3px 0 var(--color-primary); }
  .count { @apply rounded-full bg-surface-muted px-2 text-caption font-semibold text-ink; }
  /* Slide-to-confirm (design-system 8.19): a real button; full slide only */
  .slide { @apply relative block h-12 w-full overflow-hidden rounded-full border border-line-strong bg-surface-muted text-body font-semibold text-ink disabled:cursor-not-allowed; touch-action: pan-y; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  .slide-fill { @apply absolute inset-y-0 left-0 bg-primary-tint-strong; width: 0; }
  .slide-label { @apply absolute inset-0 flex items-center justify-center py-0.5 pr-4 pl-14 text-center leading-5; }
  .slide-handle { @apply absolute top-0 left-0 flex size-12 items-center justify-center rounded-full bg-primary text-on-primary; touch-action: none; cursor: grab; }
  .slide:disabled .slide-handle { @apply bg-surface-muted text-ink-faint; cursor: not-allowed; }
  .slide.back .slide-handle, .slide.back .slide-fill { transition: transform 200ms, width 200ms; }
  /* Touch targets for links (design-system 5.5): list titles and table links are 44 px tall; links inside sentences get a taller tap area without moving the text */
  a.card-title { @apply inline-flex min-h-touch items-center; }
  main li a:not(.btn):not(.card-title), main p a:not(.btn), main td a:not(.btn), main dd a:not(.btn), .alert a:not(.btn), .field-error a { padding-block: 0.875rem; }

  /* Theme toggle in the app bar */
  .theme-toggle[aria-pressed="true"] { @apply bg-primary-tint; }
}

<script>
'use strict';
/* =====================================================================
   Market Orchestrator: ONE clickable demo for all four logins (Buyer, Agent, Driver, Admin), from registration and approval
   to a completed order. SOW v2.9, architecture v1.6. Sample data only: nothing is sent anywhere, no real money moves.
   Messages follow api-contract 2.5. The product UI never calculates money; in this demo the section "O" below stands in
   for the API (fees, totals, payouts) and everything else only formats what it returns.
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const ic = (n, c = '') => `<svg class="ic ${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const plain = h => String(h).replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
const IS_EMBED = new URLSearchParams(location.search).has('embed');
if (IS_EMBED) document.documentElement.classList.add('embed');

/* ---------- theme: design-system 2 (light default, stored on the device) ---------- */
const getTheme = () => document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
function syncToggles() {
  const dark = getTheme() === 'dark';
  $$('[data-theme-toggle]').forEach(b => { b.setAttribute('aria-pressed', String(dark)); $('use', b).setAttribute('href', dark ? '#i-sun' : '#i-moon'); });
}
function setTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  try { localStorage.setItem('mo-theme', t); } catch (e) { /* storage unavailable */ }
  syncToggles();
  if (IS_EMBED) parent.postMessage({ demoTheme: t }, '*');
  else if (!$('#frame-wrap').hidden) $('#frame').contentWindow?.postMessage({ demoTheme: t }, '*');
}
const themeToggle = () => `<button type="button" class="btn btn-ghost btn-icon theme-toggle" data-theme-toggle aria-pressed="${getTheme() === 'dark'}" aria-label="Dark theme" title="Dark theme">${ic(getTheme() === 'dark' ? 'sun' : 'moon', 'size-5')}</button>`;

/* ---------- formats: design-system 4.5 and 4.6 ---------- */
const pct = bps => `${parseFloat((bps / 100).toFixed(2))}%`;
const WAT = 'Africa/Lagos';
function watParts(iso) {
  return Object.fromEntries(new Intl.DateTimeFormat('en-GB', { timeZone: WAT, weekday: 'short', day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).formatToParts(new Date(iso)).map(p => [p.type, p.value]));
}
const fmtDT = iso => { const p = watParts(iso); return `${p.weekday} ${p.day} ${p.month} ${p.year}, ${p.hour}:${p.minute} WAT`; };
const fmtDay = iso => { const p = watParts(iso); return `${p.weekday} ${p.day} ${p.month} ${p.year}`; };
const timeTag = iso => `<time datetime="${iso}">${fmtDT(iso)}</time>`;
const NOW_ISO = '2026-11-16T08:00:00Z'; /* sample "now": Mon 16 Nov 2026, 09:00 WAT */
const fileDate = '2026-11-16';
function addMonths(iso, n) {
  const d = new Date(Date.parse(iso) + 3600e3); let y = d.getUTCFullYear(), m = d.getUTCMonth() + n; const day = d.getUTCDate();
  y += Math.floor(m / 12); m = ((m % 12) + 12) % 12;
  const last = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
  return new Date(Date.UTC(y, m, Math.min(day, last), d.getUTCHours(), d.getUTCMinutes()) - 3600e3).toISOString();

function approveDialog(u, back) {
  const name = uName(u), prev = u.role === 'agent' && u.prevAgent;
  const extra = prev ? `<div class="mt-4">${pctField('apv', 'pct', 'Platform-fee percentage (%)', `Required. Pre-filled with the standard percentage (${pct(S.cfg.std)}). Check it before approving.`, String(S.cfg.std / 100))}</div>` : '';
  const d = openDialog({ title: `Approve ${esc(name)} as ${art(u.role)}?`, body: `<p>They can act once every step is done.</p>${u.role === 'agent' ? (prev ? `<p class="mt-2">${esc(name)} registered as an Agent before. <strong>No 0% period applies</strong>, whether or not the introductory 0% period is on. You must set their percentage now.</p>` : '<p class="mt-2">If the introductory 0% period is on, it starts now.</p>') : ''}`, extra, confirm: 'Approve', busy: 'Approving…',
    onConfirm: async d => {
      let bps = null;
      if (prev) { const raw = $('#apv-pct', d).value.trim(), r = raw ? pctInput(raw) : { err: "Set this Agent's platform-fee percentage to approve them." }; if (r.err) { $('#apv-pct-error', d).hidden = false; $('#apv-pct-error span', d).textContent = r.err; $('#apv-pct', d).setAttribute('aria-invalid', 'true'); $('#apv-pct', d).focus(); return { ok: false, silent: true }; } bps = r.bps; }
      const r = await call('approve'); if (!r.ok) return r;
      if (u.status !== 'pending' || u.approved) return { ok: false, status: 409, message: ERR.approve.refuse[1] };
      const wasDone = allStepsDone(u); u.status = 'active'; u.approved = true; u.approvedAt = nowIso();
      let h = `<p class="font-semibold">${esc(name)} approved.</p>`;
      if (u.role === 'agent') {
        if (prev) { u.bps = bps; u.decided = true; u.zeroEnd = null; u.resetBps = null; h += `<p class="mt-2">Platform fee set to ${pct(bps)}. No 0% period applies, so there is no "0% until" date and no fee-review prompt.</p>`; audit(nm(S.sess), 'Approval', `${name} approved as an Agent (previously registered). Percentage set to ${pct(bps)}. No 0% period.`); }
        else if (S.zeroOn) { u.zeroEnd = addMonths(nowIso(), S.zeroMonths); const was = u.resetBps; u.bps = 0; u.resetBps = null; u.decided = false; h += `<p class="mt-2">${zeroBadge(u)}</p><p class="mt-2">Their 0% period starts today, ${fmtDay(nowIso())}, which is their approval date and their onboarding date.</p>${was ? `<p class="mt-1">Their earlier percentage of ${pct(was)} was reset to 0%.</p>` : ''}<p class="mt-1 text-small text-ink-soft">The Agent sees only their current percentage, not this date.</p>`; audit(nm(S.sess), 'Approval', `${name} approved as an Agent. 0% period started${was ? `; earlier ${pct(was)} reset to 0%` : ''}.`); }
        else { u.zeroEnd = null; h += `<p class="mt-2">No 0% period applies because the introductory 0% period is off. Their platform fee is 0% until you set a percentage under Agents.</p>`; audit(nm(S.sess), 'Approval', `${name} approved as an Agent. No 0% period (setting off).`); }
      } else audit(nm(S.sess), 'Approval', `${name} approved as ${art(u.role)}.`);
      h += `<p class="mt-2">${wasDone ? 'Every step is done, so they can act now.' : 'They can act once they finish their remaining steps.'}</p>`;
      S.adminResult = { html: h }; return { ok: true };
    }, onClose: back });
  if (prev) $('#apv-pct', d).focus();
}

ACT.latedecide = el => {

    <div class="choice"><label for="ld-c"><input type="radio" name="ld" id="ld-c" value="cancel">Cancel and refund in full</label><p class="pb-2 pl-8 text-small text-ink-soft">A full refund of ${fmtN(o.grand)} is sent to the Buyer's refund details. Nothing is paid out.${o.pickedAt ? " If the goods were picked up, the Agent arranges their return outside the platform." : ''}</p></div>

function guard(name, parts) {
  const a = me();
  if (!a) return PUBLIC.includes(name) ? [name, parts] : ['signin', []];
  if (PUBLIC.includes(name) || !VIEWS[name]) return [landing(a), []];
  const r = a.role;
  if (r === 'admin') return ROUTES.admin.includes(name) ? [name, parts] : ['users', []];
  if (name === 'account') return [name, parts];
  if (name === 'gates' || name === 'awaiting') return fullAccess(a) ? ['home', []] : nextGate(a) ? ['gates', []] : ['awaiting', []];
  if (!ROUTES[r].includes(name)) return [landing(a), []];
  if (name === 'producers' || name === 'producer') return a.g.fee ? [name, parts] : ['gates', []];
  if (name === 'documents') return nextGate(a) ? ['gates', []] : [name, parts];

window.addEventListener('hashchange', () => { render({ focus: true }); if (!$('#frame-wrap').hidden) loadFrame(); });

function signOut() {
  MENU_CLOSE(); S.sess = null; S.pageState = 'normal'; S.editDetails = false; S.editProfile = false; S.editPw = false; S.dlStatus = null;
  S.flash = { html: 'You have signed out.', say: 'You have signed out.' }; nav('signin');
}
function ctl(key, v, el) {
  if (key === 'state') S.pageState = v;
  else if (key === 'reg') S.regOpen = v === 'open';
  else if (key === 'zero') S.zeroOn = v === 'on';
  else if (key === 'inprog') { const a = me(); if (a) a.inProgress = v === 'yes'; }
  else if (key === 'clock') { S.nowIso = new Date(nowMs() + Number(v) * 3600e3).toISOString(); const done = runWorker(); toast(done.length ? `Clock now ${fmtDT(nowIso())}. Worker: ${done.join('; ')}.` : `Clock now ${fmtDT(nowIso())}. The worker had nothing to do.`); }
  else if (key === 'webhook') { const n = webhook(v === 'ok'); toast(n ? `Paystack webhook: ${plural(n, 'transfer')} ${v === 'ok' ? 'confirmed' : 'failed'}.` : 'No transfer is pending.'); }
  else if (key === 'expirecode') { S.orders.forEach(o => { if (o.code) o.code.exp = Date.now() - 1000; }); }
  else if (key === 'approve-now') { const a = me(); if (a && !a.approved) { a.approved = true; a.status = 'active'; a.approvedAt = nowIso(); } toast('Simulated: an Admin approved this account. The page does not change until you press Check again.'); return; }
  else if (key === 'reset') { const c = S.ctl, n = S.next; S = defaults(); S.ctl = c; S.next = n; lastKey = ''; history.replaceState(null, '', '#signin'); }
  render({ focus: false });
}
async function checkAgain(btn) {
  const done = busy(btn, 'Checking…'); $('#check-status').textContent = ''; $('#check-error').textContent = '';
  const r = await call('check', 800); done();
  if (!r.ok) return void ($('#check-error').textContent = r.message);
  const a = me();
  if (a.approved) { say('Your account is approved.'); return nav(landing(a)); }
  $('#check-status').textContent = 'Still awaiting approval.';
}
const FILL = {
  register: () => ({ role: 'buyer', first: 'Wale', last: 'Adeyemi', email: 'wrong.role@example.com', phone: '+2348031112233', password: 'Sample123', privacy: true }),
  newadmin: () => ({ first: 'Zainab', last: 'Yusuf', email: 'zainab.yusuf@example.com', phone: '' }),
  setpw: () => { const [em, c] = Object.entries(S.adminCodes)[0] || ['', '']; return { email: em, code: c ? c.slice(0, 4) + '-' + c.slice(4) : '', pw: 'Sample123', privacy: true }; }
};
function MENU_CLOSE() { $$('[data-menu]').forEach(m => { m.hidden = true; $('[data-menu-btn]', m.closest('[data-menu-root]')).setAttribute('aria-expanded', 'false'); }); }

document.addEventListener('click', e => {
  const t = e.target;
  const mb = t.closest('[data-menu-btn]');
  $$('[data-menu]').forEach(m => { const root = m.closest('[data-menu-root]'), btn = $('[data-menu-btn]', root); if (mb === btn) { m.hidden = !m.hidden; btn.setAttribute('aria-expanded', String(!m.hidden)); } else { m.hidden = true; btn.setAttribute('aria-expanded', 'false'); } });
  let x;
  if (t.closest('[data-theme-toggle]')) setTheme(getTheme() === 'dark' ? 'light' : 'dark');
  else if (t.closest('[data-skip]')) { e.preventDefault(); $('#main')?.focus(); }
  else if (t.closest('[data-signout]')) signOut();
  else if (t.closest('[data-privacy]')) { e.preventDefault(); openPrivacy(); }
  else if ((x = t.closest('[data-toggle-pw]'))) { const i = $('#' + x.dataset.togglePw), on = i.type === 'password'; i.type = on ? 'text' : 'password'; x.setAttribute('aria-pressed', String(on)); $('use', x).setAttribute('href', on ? '#i-eye-off' : '#i-eye'); x.lastChild.textContent = on ? 'Hide password' : 'Show password'; }
  else if ((x = t.closest('[data-focus]'))) { e.preventDefault(); $('#' + x.dataset.focus)?.focus(); }
  else if ((x = t.closest('[data-ctl]'))) ctl(x.dataset.ctl, x.dataset.v, x);
  else if ((x = t.closest('[data-cred]'))) { if (S.sess) S.sess = null; S.vals.signin = { email: x.dataset.cred, password: PW }; S.sub.signin = false; nav('signin'); }
  else if ((x = t.closest('[data-fill]'))) { const k = x.dataset.fill; S.vals[k] = FILL[k](); S.sub[k] = false; render({ focus: false }); $(`form[data-form="${k}"] input, form[data-form="${k}"] select`)?.focus(); }
  else if ((x = t.closest('[data-check]'))) checkAgain(x);
  else if (t.closest('[data-forgot-again]')) { S.forgotDone = null; render({ focus: true }); }
  else if (t.closest('[data-expire-code]')) { if (S.codes) { S.codes.expired = true; render({ focus: false }); say('The emailed code has expired.'); } }
  else if ((x = t.closest('[data-retry]'))) { S.pageState = 'loading'; render({ focus: false }); setTimeout(() => { S.pageState = 'normal'; render({ focus: false }); }, 900); }
  else if (t.closest('[data-edit-details]')) { S.editDetails = true; S.vals.details = {}; S.vals.pdetails = {}; render({ focus: false }); ($('#details-bank') || $('#pdetails-bank'))?.focus(); }
  else if (t.closest('[data-cancel-details]')) { S.editDetails = false; S.sub.details = false; S.sub.pdetails = false; render({ focus: false }); $('[data-edit-details]')?.focus(); }
  else if (t.closest('[data-edit-profile]')) { S.editProfile = true; render({ focus: false }); $('#profile-first')?.focus(); }
  else if (t.closest('[data-cancel-profile]')) { S.editProfile = false; S.sub.profile = false; render({ focus: false }); $('[data-edit-profile]')?.focus(); }
  else if (t.closest('[data-edit-pw]')) { S.editPw = true; S.vals.pw = {}; S.sub.pw = false; render({ focus: false }); $('#pw-current')?.focus(); }
  else if (t.closest('[data-cancel-pw]')) { S.editPw = false; S.sub.pw = false; S.vals.pw = {}; render({ focus: false }); $('[data-edit-pw]')?.focus(); }
  else if (t.closest('[data-remove-details]')) {
    openDialog({
      title: 'Remove your payout details?', body: `<p>${me().role === 'driver' ? "Agents can't send you a delivery offer until you add them again." : "You can't send offers until you add them again."}</p>`,
      back: 'Keep them', confirm: 'Remove details', confirmCls: 'btn-danger', busy: 'Removing…',
      onConfirm: async () => { const r = await call('removeDetails'); if (r.ok) { me().details = null; S.flash = { html: 'Payout details removed.', say: 'Payout details removed.', role: 'status' }; } return r; },
      onClose: () => { render({ focus: false }); ($('#acct-flash') || $('h1'))?.focus(); }
    });
  }
  else if (t.closest('[data-download]')) downloadData(t.closest('[data-download]'));
  else if (t.closest('[data-delete-account]')) deleteAccount();
  else if ((x = t.closest('[data-tab]'))) { S.adminTab = x.dataset.tab; S.adminResult = null; render({ focus: false }); $(`#tab-${S.adminTab}`)?.focus(); }
  else if ((x = t.closest('[data-adm-role]'))) { S.adminRole = x.dataset.admRole; S.adminResult = null; render({ focus: false }); $(`[data-adm-role="${S.adminRole}"]`)?.focus(); }
  else if ((x = t.closest('[data-act]'))) adminAct(x.dataset.act, x.dataset.id);
  else if ((x = t.closest('[data-resend]'))) resendCode(x);
  else if ((x = t.closest('[data-archive]'))) archiveProducer(x.dataset.archive);
  else if ((x = t.closest('[data-unarchive]'))) unarchiveProducer(x);
  else if ((x = t.closest('[data-ppage]'))) { S.prodPage = +x.dataset.ppage; refreshProducers(); $('#prod-results [data-ppage]:not([disabled])')?.focus(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') MENU_CLOSE();
  const tab = e.target.closest?.('[role="tab"]');
  if (tab && ['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)) {
    e.preventDefault(); const tabs = $$('[role="tab"]', tab.parentElement), i = tabs.indexOf(tab);
    const n = e.key === 'Home' ? 0 : e.key === 'End' ? tabs.length - 1 : (i + (e.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length;
    S.adminTab = tabs[n].dataset.tab; S.adminResult = null; render({ focus: false }); $(`#tab-${S.adminTab}`)?.focus();
  }
});
document.addEventListener('toggle', e => { if (e.target.id === 'ctl-details') S.ctl = e.target.open; }, true);
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault();
  const n = f.dataset.form, v = readVals(f); S.vals[n] = v; S.sub[n] = true; S.serverErr[n] = {};
  const errs = FORMS[n].validate(v); applyErrors(n, errs, true); if (Object.keys(errs).length) return;
  formError(n, null); FORMS[n].submit(v, f);
});
function onFieldEvent(e) {
  const t = e.target;
  if (e.type === 'input' && t.id === 'users-q') { S.adminQ = t.value; const r = $('#users-results'); if (r) r.innerHTML = usersResults(); return; }
  if (e.type === 'input' && t.id === 'prod-q') { S.prodQ = t.value; S.prodPage = 1; refreshProducers(); return; }
  if (e.type === 'change' && t.id === 'prod-arch') { S.prodArch = t.checked; S.prodPage = 1; refreshProducers(); return; }
  const f = t.closest?.('form[data-form]'); if (!f || !t.name) return;
  const n = f.dataset.form; S.vals[n] = readVals(f);
  if (e.type === 'input' && S.serverErr[n]) delete S.serverErr[n][t.name];
  if (e.type === 'change' && n === 'register' && t.name === 'role') { $('#register-phone-label').innerHTML = t.value === 'agent' ? 'Phone <span class="field-optional">(optional)</span>' : 'Phone'; $('#register-submit').textContent = createLabel(t.value); }
  /* Re-check only the field that changed. Text fields are checked on blur, but not when focus moves to a button or link,
     so the layout cannot shift under a click on the submit button (submit validates everything anyway). */
  const isText = t.tagName === 'TEXTAREA' || ['text', 'email', 'tel', 'password', 'search', 'number'].includes(t.type);
  const goingToButton = e.relatedTarget && e.relatedTarget.closest?.('button,a');
  if (S.sub[n] && t.type !== 'button' && ((e.type === 'focusout' && isText && !goingToButton) || (e.type === 'change' && !isText))) applyErrors(n, withServer(n, FORMS[n].validate(S.vals[n])), false, t.name);
}
['input', 'change', 'focusout'].forEach(t => document.addEventListener(t, onFieldEvent));
document.addEventListener('change', e => {
  if (e.target.matches('[data-ctl-select]')) S.next = e.target.value;
  if (e.target.id === 'jump-select' && e.target.value) { const v = e.target.value, pub = PUBLIC.includes(v.split('/')[0]); if (pub && S.sess) { S.sess = null; S.flash = null; } nav(v); }
});

/* responsive preview (as in the first demo): the app re-opens inside an iframe of the chosen width */
const base = () => location.href.split('#')[0].split('?')[0];
function loadFrame() { $('#frame').src = `${base()}?embed=1&theme=${getTheme()}&st=${encodeURIComponent(JSON.stringify(S))}#${curKey}`; }
$('#width-select').addEventListener('change', e => {
  const v = e.target.value, fw = $('#frame-wrap'), fr = $('#frame');
  if (v === 'fit') { fw.hidden = true; $('#stage').hidden = false; fr.removeAttribute('src'); render({ focus: false }); return; }
  fr.style.width = v + 'px'; loadFrame(); fw.hidden = false; $('#stage').hidden = true;
});
window.addEventListener('message', e => {
  if (!e.data || IS_EMBED) return;
  if (e.data.demoTheme) { document.documentElement.setAttribute('data-theme', e.data.demoTheme); try { localStorage.setItem('mo-theme', e.data.demoTheme); } catch (x) { /* ignore */ } syncToggles(); }
  if (e.data.demo) { S = e.data.S; curKey = e.data.route; lastKey = curKey; history.replaceState(null, '', '#' + curKey); syncJump(); }
});
if (IS_EMBED) window.addEventListener('message', e => { if (e.data && e.data.demoTheme) { document.documentElement.setAttribute('data-theme', e.data.demoTheme); syncToggles(); } });
render({ focus: false });

</script>
